[package]
name = "nyapassword-desktop"
version = "0.1.4"
description = "NyaPassword desktop app: the shared vault UI over the native client core"
authors = ["NyaPassword contributors"]
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"

[lib]
name = "nyapassword_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
npw-core = { path = "../../common/crates/npw-core" }
npw-store-sqlite = { path = "../../common/crates/npw-store-sqlite" }
npw-crypto = { path = "../../common/crates/npw-crypto" }
npw-model = { path = "../../common/crates/npw-model" }
npw-otp = { path = "../../common/crates/npw-otp" }
npw-match = { path = "../../common/crates/npw-match" }
npw-import = { path = "../../common/crates/npw-import" }
npw-ssh = { path = "../../common/crates/npw-ssh" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
hkdf = "0.12"
sha2 = "0.10"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
minisign-verify = "0.3"
keyring = "4"
gethostname = "1"
# the ssh-agent and the browser bridge serve local sockets / named pipes (tauri's runtime is tokio)
tokio = { version = "1", features = ["net", "io-util", "io-std", "rt", "rt-multi-thread", "sync", "time", "macros"] }
# browser bridge: ECDH P-256 + HKDF-SHA256 + AES-256-GCM, what WebCrypto offers the extension natively
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
arboard = "3"

[dev-dependencies]
minisign = "0.10"
tempfile = "3"
